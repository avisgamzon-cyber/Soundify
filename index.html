
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soundify — Music for everyone</title>
<style>
:root{--panel:#121212;--muted:#aaa;--green:#1ed760}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font:14px Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:0;color:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:225px 1fr;grid-template-rows:minmax(500px,1fr) 88px;gap:8px;padding:8px}
.sidebar{display:flex;flex-direction:column;gap:8px}
.nav,.library,.main{background:var(--panel);border-radius:8px}
.nav{padding:18px 12px}
.brand{font-size:22px;font-weight:bold;margin:5px 8px 22px}
.brand span{background:var(--green);color:#000;border-radius:50%;padding:5px}
.nav button,.lib-head button{display:block;background:none;color:var(--muted);padding:12px 8px;text-align:left;width:100%;font-weight:bold}
.nav button:hover,.nav button.active{color:white}
.library{padding:14px 8px;overflow:auto}
.lib-head{display:flex;align-items:center}
.lib-head button:last-child{width:auto;font-size:20px}
.lib-tools{display:flex;gap:8px;margin:8px 0}
.chip{background:#282828;border-radius:18px;padding:8px 12px}
.lib-item{display:flex;align-items:center;gap:10px;padding:8px;cursor:pointer}
.lib-item img{width:44px;height:44px;object-fit:cover}
.lib-item small{display:block;color:var(--muted);margin-top:5px}
.main{overflow:auto;background:linear-gradient(#203a31,#121212 330px)}
.topbar{position:sticky;top:0;background:#101412ee;padding:16px;display:flex;gap:10px;align-items:center;z-index:2}
.searchbox{background:white;color:#111;border-radius:24px;padding:12px 16px;display:flex;gap:8px;flex:1;max-width:550px}
.searchbox input{border:0;outline:0;flex:1;min-width:0}
.profile{margin-left:auto;background:#050505;border-radius:20px;padding:10px}
.content{padding:8px 24px 32px}
.welcome{font-size:30px}
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.quick{display:flex;align-items:center;gap:10px;background:#ffffff19;border-radius:5px;overflow:hidden;font-weight:bold;cursor:pointer}
.quick img{width:58px;height:58px;object-fit:cover}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}
.section-head h2{margin:0;font-size:23px}
.section-head button{background:none;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.card{background:#181818;padding:12px;border-radius:7px;min-width:0;cursor:pointer}
.card:hover{background:#292929}
.cover{position:relative;aspect-ratio:1;margin-bottom:12px}
.cover img{width:100%;height:100%;object-fit:cover;border-radius:5px}
.cover button{position:absolute;right:8px;bottom:8px;border-radius:50%;background:var(--green);color:#000;width:42px;height:42px;opacity:0}
.card:hover .cover button{opacity:1}
.card h3{font-size:14px;margin:0 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{color:var(--muted);font-size:12px;line-height:1.4;margin:0}
.status,.empty{color:var(--muted);line-height:1.6}
.track-table{width:100%;border-collapse:collapse;margin-top:15px}
.track-table th{text-align:left;color:var(--muted);font-weight:normal;border-bottom:1px solid #333;padding:10px 7px}
.track-table td{padding:9px 7px;color:var(--muted)}
.track-table tr:hover{background:#ffffff12}
.track-title{display:flex;align-items:center;gap:10px;min-width:190px}
.track-title img{width:42px;height:42px;object-fit:cover}
.track-title strong{color:white;display:block;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-title small{display:block;margin-top:5px}
.player{grid-column:1/3;display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;gap:18px;padding:0 14px;background:#000;border-top:1px solid #292929}
.now-playing{display:flex;align-items:center;gap:10px;min-width:0}
.now-playing img{width:52px;height:52px;object-fit:cover}
.now-playing strong,.now-playing small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-playing small{color:var(--muted);margin-top:5px}
.player-controls{display:flex;flex-direction:column;align-items:center;gap:7px}
.control-row{display:flex;align-items:center;gap:18px}
.control-row button{background:none;color:#ddd;font-size:18px}
.control-row .play-main{background:white;color:black;border-radius:50%;width:34px;height:34px}
.progress{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;width:100%;max-width:500px}
.progress input{flex:1;min-width:30px;accent-color:var(--green)}
.volume{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.volume input{width:90px;accent-color:var(--green)}
.like{background:none;color:var(--muted);font-size:18px}
.saved{color:var(--green)}
.toast{display:none;position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#333;padding:12px 18px;border-radius:8px;z-index:10;max-width:90vw}
.modal-back{display:none;position:fixed;inset:0;background:#000b;place-items:center;z-index:8}
.modal{background:#282828;padding:24px;border-radius:10px;width:min(400px,90vw)}
.modal input{width:100%;padding:12px;margin:10px 0 18px}
.primary{background:var(--green);color:#000;padding:11px 18px;border-radius:22px;font-weight:bold}
.secondary{background:none;padding:11px}
.actions{display:flex;justify-content:flex-end}
.mobile-nav{display:none}
@media(max-width:900px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.quick-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){
.app{display:flex;flex-direction:column;padding:0}
.sidebar{display:none}
.main{border-radius:0;min-height:calc(100vh - 78px)}
.content{padding:10px 14px 110px}
.topbar{padding:10px}
.welcome{font-size:25px}
.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
.player{position:sticky;bottom:0;grid-column:auto;grid-template-columns:1fr auto;gap:6px;padding:7px}
.now-playing img{width:42px;height:42px}
.control-row{gap:9px}
.control-row button:not(.play-main){display:none}
.progress{width:145px}
.volume{display:none}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">

<script>
(() => {
const $ = s => document.querySelector(s);
const audio = $('#audio');
const fallback = 'https://placehold.co/400x400/282828/eee?text=♪';

let tracks = [], currentList = [], currentIndex = -1;
let currentPage = 'home', timer, shuffle = false, repeat = false;

let playlists = JSON.parse(localStorage.getItem('soundify_playlists') || '[]');
let liked = JSON.parse(localStorage.getItem('soundify_liked') || '[]');

/* Spotify configuration */
const SPOTIFY_CLIENT_ID = '05eeedd9fef64a59b9d1d0cf6508187a';
const SPOTIFY_REDIRECT_URI = 'https://avisgamzon-cyber.github.io/Soundify/';

let spotifyAccessToken = sessionStorage.getItem('soundify_sp_access') || '';
let spotifyRefreshToken = sessionStorage.getItem('soundify_sp_refresh') || '';
let spotifyExpiresAt = Number(sessionStorage.getItem('soundify_sp_expiry') || 0);
let spotifyPlayer = null;
let spotifyDeviceId = '';
let spotifySDKReady = false;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

const art = t => t?.artworkUrl100?.replace('100x100bb','500x500bb') || fallback;
const artist = t => t?.artistName || t?.artist || 'Unknown artist';

const fmt = n => {
n = Math.max(0, Math.floor(+n || 0));
return Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
};

function toast(s) {
const e = $('#toast');
e.textContent = s;
e.style.display = 'block';
clearTimeout(toast.timer);
toast.timer = setTimeout(() => e.style.display = 'none', 3000);
}

function persist() {
localStorage.setItem('soundify_playlists', JSON.stringify(playlists));
localStorage.setItem('soundify_liked', JSON.stringify(liked));
renderLibrary();
}

function clean(s = '') {
return String(s).toLowerCase().normalize('NFD')
.replace(/[\u0300-\u036f]/g,'')
.replace(/[^a-z0-9\s]/g,' ')
.replace(/\s+/g,' ').trim();
}

function sim(a,b) {
a = clean(a); b = clean(b);
if (!a || !b) return 0;
if (a === b) return 1;
let row = Array.from({length:b.length + 1}, (_,i) => i);
for (let i=1;i<=a.length;i++) {
let prev=row[0]; row[0]=i;
for(let j=1;j<=b.length;j++) {
let old=row[j];
row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));
prev=old;
}
}
return Math.max(0,1-row[b.length]/Math.max(a.length,b.length));
}

function score(t,q) {
return Math.max(
sim(q,t.trackName || t.title),
sim(q,t.artistName)*.92,
sim((t.trackName || t.title || '')+' '+(t.artistName || ''),q)*.98
);
}

/* Spotify Authorization Code with PKCE */
function randomString(length = 64) {
const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
const bytes = crypto.getRandomValues(new Uint8Array(length));
return Array.from(bytes, b => chars[b % chars.length]).join('');
}

async function sha256(value) {
const data = new TextEncoder().encode(value);
const hash = await crypto.subtle.digest('SHA-256', data);
return btoa(String.fromCharCode(...new Uint8Array(hash)))
.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function spotifyLogin() {
const verifier = randomString();
const state = randomString(32);

sessionStorage.setItem('soundify_sp_verifier', verifier);
sessionStorage.setItem('soundify_sp_state', state);

const challenge = await sha256(verifier);

const params = new URLSearchParams({
client_id: SPOTIFY_CLIENT_ID,
response_type: 'code',
redirect_uri: SPOTIFY_REDIRECT_URI,
code_challenge_method: 'S256',
code_challenge: challenge,
state,
scope: [
'streaming',
'user-read-email',
'user-read-private',
'user-read-playback-state',
'user-modify-playback-state'
].join(' ')
});

location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
}

function saveSpotifyTokens(data) {
spotifyAccessToken = data.access_token;
sessionStorage.setItem('soundify_sp_access', spotifyAccessToken);

if (data.refresh_token) {
spotifyRefreshToken = data.refresh_token;
sessionStorage.setItem('soundify_sp_refresh', spotifyRefreshToken);
}

spotifyExpiresAt = Date.now() + (data.expires_in || 3600) * 1000;
sessionStorage.setItem('soundify_sp_expiry', String(spotifyExpiresAt));
$('#profileBtn').textContent = 'Spotify Connected';
}

async function spotifyTokenRequest(body) {
const response = await fetch('https://accounts.spotify.com/api/token', {
method: 'POST',
headers: {'Content-Type':'application/x-www-form-urlencoded'},
body
});

const data = await response.json();

if (!response.ok) {
throw new Error(data.error_description || data.error || 'Spotify login failed');
}
return data;
}

async function getSpotifyToken() {
if (spotifyAccessToken && Date.now() < spotifyExpiresAt - 60000) {
return spotifyAccessToken;
}

if (!spotifyRefreshToken) {
throw new Error('Please connect Spotify first.');
}

const data = await spotifyTokenRequest(new URLSearchParams({
client_id: SPOTIFY_CLIENT_ID,
grant_type: 'refresh_token',
refresh_token: spotifyRefreshToken
}));

saveSpotifyTokens(data);
return spotifyAccessToken;
}

async function handleSpotifyCallback() {
const params = new URLSearchParams(location.search);
const code = params.get('code');
const returnedState = params.get('state');

if (params.has('error')) {
history.replaceState({}, '', location.pathname);
toast('Spotify login was cancelled or denied.');
return;
}

if (!code) {
if (spotifyAccessToken || spotifyRefreshToken) {
$('#profileBtn').textContent = 'Spotify Connected';
initSpotifyPlayer();
}
return;
}

const expectedState = sessionStorage.getItem('soundify_sp_state');
const verifier = sessionStorage.getItem('soundify_sp_verifier');

if (!expectedState || returnedState !== expectedState || !verifier) {
history.replaceState({}, '', location.pathname);
toast('Spotify security check failed. Please connect again.');
return;
}

try {
const data = await spotifyTokenRequest(new URLSearchParams({
client_id: SPOTIFY_CLIENT_ID,
grant_type: 'authorization_code',
code,
redirect_uri: SPOTIFY_REDIRECT_URI,
code_verifier: verifier
}));

saveSpotifyTokens(data);
sessionStorage.removeItem('soundify_sp_verifier');
sessionStorage.removeItem('soundify_sp_state');
history.replaceState({}, '', location.pathname);

initSpotifyPlayer();
toast('Spotify connected!');
} catch (error) {
history.replaceState({}, '', location.pathname);
toast(error.message);
}
}

async function spotifyFetch(url, options = {}) {
const token = await getSpotifyToken();

const response = await fetch(url, {
...options,
headers: {
...(options.headers || {}),
Authorization: 'Bearer ' + token
}
});

if (!response.ok) {
const data = await response.json().catch(() => ({}));
throw new Error(data.error?.message || 'Spotify request failed (' + response.status + ')');
}

return response.status === 204 ? null : response.json();
}
  
async function spotifySearch(q, limit = 10) {
const data = await spotifyFetch(
'https://api.spotify.com/v1/search?' +
new URLSearchParams({q, type:'track', limit:String(limit)})
);

return (data.tracks?.items || []).map(t => ({
id: 'sp-' + t.id,
spotifyId: t.id,
spotifyUri: t.uri,
title: t.name,
trackName: t.name,
artistName: t.artists.map(a => a.name).join(', '),
artist: t.artists.map(a => a.name).join(', '),
collectionName: t.album.name,
artworkUrl100: t.album.images?.[0]?.url || '',
preview_url: '',
duration: t.duration_ms / 1000
}));
}

/* Spotify Web Playback SDK */
function initSpotifyPlayer() {
if (!spotifySDKReady || (!spotifyAccessToken && !spotifyRefreshToken) || spotifyPlayer) return;

spotifyPlayer = new Spotify.Player({
name: 'Soundify Web Player',
volume: Number($('#volume').value),
getOAuthToken: async callback => {
try {
callback(await getSpotifyToken());
} catch (error) {
toast('Reconnect Spotify to continue.');
}
}
});

spotifyPlayer.addListener('ready', ({device_id}) => {
spotifyDeviceId = device_id;
toast('Spotify player ready!');
});

spotifyPlayer.addListener('not_ready', () => {
spotifyDeviceId = '';
});

spotifyPlayer.addListener('initialization_error', ({message}) => toast(message));
spotifyPlayer.addListener('authentication_error', ({message}) => toast(message));
spotifyPlayer.addListener('account_error', ({message}) => toast(message));
spotifyPlayer.addListener('playback_error', ({message}) => toast(message));

spotifyPlayer.addListener('player_state_changed', state => {
if (!state) return;

$('#playBtn').textContent = state.paused ? '▶' : 'Ⅱ';
$('#elapsed').textContent = fmt(state.position / 1000);
$('#duration').textContent = fmt(state.duration / 1000);
$('#seek').value = state.duration ? state.position / state.duration * 1000 : 0;
});

spotifyPlayer.connect().then(ok => {
if (!ok) toast('Could not connect Spotify player.');
});
}

window.onSpotifyWebPlaybackSDKReady = () => {
spotifySDKReady = true;
initSpotifyPlayer();
};

async function playSpotifyTrack(track) {
await getSpotifyToken();

if (!spotifyPlayer || !spotifyDeviceId) {
initSpotifyPlayer();
toast('Spotify is connecting. Wait a moment, then press play again.');
return;
}

await spotifyPlayer.activateElement();

await spotifyFetch(
'https://api.spotify.com/v1/me/player/play?device_id=' + encodeURIComponent(spotifyDeviceId),
{
method:'PUT',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({uris:[track.spotifyUri]})
}
);
}

/* Existing iTunes search remains as a fallback */
function api(q, limit = 25) {
if (spotifyAccessToken || spotifyRefreshToken) {
return spotifySearch(q, limit);
}

return new Promise((resolve,reject) => {
const cb = 'soundifyCB_' + Math.random().toString(36).slice(2);
const script = document.createElement('script');

const params = new URLSearchParams({
term:q, entity:'song', limit:String(limit), country:'US', callback:cb
});

let done = false;

const cleanup = () => {
if (done) return;
done = true;
try { delete window[cb]; } catch(e) { window[cb] = undefined; }
script.remove();
};

const timeout = setTimeout(() => {
cleanup();
reject(Error('Music search timed out'));
},12000);

window[cb] = d => {
clearTimeout(timeout);
cleanup();

resolve((d.results || [])
.filter(t => t.kind === 'song')
.map(t => ({
...t,
id:String(t.trackId),
title:t.trackName,
trackName:t.trackName,
preview_url:t.previewUrl || '',
duration:(t.trackTimeMillis || 0)/1000
})));
};

script.onerror = () => {
clearTimeout(timeout);
cleanup();
reject(Error('Search failed'));
};

script.src = 'https://itunes.apple.com/search?' + params.toString();
document.head.appendChild(script);
});
}

function isLiked(t) {
return liked.some(x => String(x.id) === String(t.id));
}

function card(t,i) {
return `<article class="card" data-play="${i}">
<div class="cover">
<img loading="lazy" src="${esc(art(t))}" alt="">
<button data-play="${i}">▶</button>
</div>
<h3>${esc(t.title)}</h3>
<p>${esc(artist(t))}</p>
</article>`;
}

async function home() {
currentPage = 'home';

$('#content').innerHTML = `
<h1 class="welcome">Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}</h1>
<div class="quick-grid">
<div class="quick" data-page="liked"><img src="${esc(liked[0]?art(liked[0]):fallback)}"><span>Liked Songs</span></div>
<div class="quick" data-page="search"><img src="${fallback}"><span>Discover new music</span></div>
<div class="quick" data-page="library"><img src="${fallback}"><span>Your playlists</span></div>
</div>
<div class="section-head"><h2>Popular tracks</h2><button id="refresh">REFRESH</button></div>
<div id="homeCards" class="cards"><p class="status">Loading songs…</p></div>
<p class="status">Connect Spotify for Spotify search and playback, or browse free previews without connecting.</p>`;

try {
tracks = await api('top hits',25);
currentList = tracks;
$('#homeCards').innerHTML = tracks.slice(0,15).map(card).join('') || '<p class="empty">No tracks found.</p>';
} catch(e) {
$('#homeCards').innerHTML = '<p class="empty">Could not load songs. Check your internet connection and try again.</p>';
}

$('#refresh').onclick = home;
}

function searchIntro() {
currentPage = 'search';

$('#content').innerHTML = `
<h1 class="welcome">Search</h1>
<p class="status">Search a song or artist. If you make a typo, Soundify tries to put the closest matches first.</p>
<div class="quick-grid">
${[['Pop','#5a3476'],['Chill','#315b55'],['Hip-Hop','#8b5b25'],['Rock','#365b83'],['Dance','#8c3150'],['Jazz','#376e4b']]
.map(([n,c])=>`<div class="quick mood" data-q="${n}" style="background:${c};padding:18px">${n}</div>`).join('')}
</div>`;

document.querySelectorAll('.mood').forEach(b => b.onclick = () => {
$('#searchInput').value = b.dataset.q;
search(b.dataset.q);
});
}

async function search(q) {
q = q.trim();
currentPage = 'search';

if (!q) return searchIntro();

$('#content').innerHTML = `<h1 class="welcome">Search results</h1><p class="status">Searching for “${esc(q)}”…</p>`;

try {
let arr = await api(q,25);

if (!arr.length || Math.max(0,...arr.map(t=>score(t,q))) < .4) {
let words = clean(q).split(' ').filter(w=>w.length>1).slice(0,4);
let groups = await Promise.all(words.map(w=>api(w,15).catch(()=>[])));
let seen = new Set(arr.map(t=>t.id));

for (let g of groups) {
for (let t of g) {
if (!seen.has(t.id)) {
seen.add(t.id);
arr.push(t);
}
}
}
}

arr.sort((a,b)=>score(b,q)-score(a,q));
tracks = arr;
results(`Results for “${q}”`,arr);

if (arr.length && score(arr[0],q) < .65) {
toast('Closest matches are shown first');
}
} catch(e) {
$('#content').innerHTML = `<h1 class="welcome">Search</h1><p class="empty">${esc(e.message)}. Check your connection and try again.</p>`;
}
}

function results(title,arr) {
currentList = arr;

$('#content').innerHTML = `
<h1 class="welcome">${esc(title)}</h1>
<div class="section-head"><h2>Songs</h2><span class="status">${arr.length} results</span></div>
<table class="track-table">
<thead><tr><th>#</th><th>Title</th><th>Album</th><th>Save</th><th>Time</th></tr></thead>
<tbody>
${arr.map((t,i)=>`
<tr>
<td><button data-play="${i}" style="background:none">▶</button></td>
<td><div class="track-title">
<img src="${esc(art(t))}" alt="">
<div><strong>${esc(t.title)}</strong><small>${esc(artist(t))}</small></div>
</div></td>
<td>${esc(t.collectionName || '')}</td>
<td><button class="like ${isLiked(t)?'saved':''}" data-like="${esc(t.id)}">${isLiked(t)?'♥':'♡'}</button></td>
<td>${fmt(t.duration)}</td>
</tr>`).join('')}
</tbody>
</table>
${arr.length?'':'<p class="empty">No songs found. Try a different search.</p>'}`;
}

function renderLibrary() {
const el = $('#libraryItems');

el.innerHTML = playlists.map(p=>`
<div class="lib-item" data-page="playlist:${p.id}">
<img src="${esc(p.tracks[0]?art(p.tracks[0]):fallback)}" alt="">
<div><strong>${esc(p.name)}</strong><small>Playlist · ${p.tracks.length} songs</small></div>
</div>`).join('') + `
<div class="lib-item" data-page="liked">
<img src="${esc(liked[0]?art(liked[0]):fallback)}" alt="">
<div><strong>Liked Songs</strong><small>Playlist · ${liked.length} songs</small></div>
</div>`;
}

function libraryPage() {
currentPage = 'library';
renderLibrary();

$('#content').innerHTML = `
<h1 class="welcome">Your Library</h1>
<div class="section-head"><h2>Playlists</h2><button id="libCreate">＋ CREATE PLAYLIST</button></div>
<div class="cards">
${playlists.map(p=>`
<article class="card" data-page="playlist:${p.id}">
<div class="cover"><img src="${esc(p.tracks[0]?art(p.tracks[0]):fallback)}" alt=""></div>
<h3>${esc(p.name)}</h3><p>${p.tracks.length} songs</p>
</article>`).join('')}
</div>
${playlists.length?'':'<p class="empty">Create a playlist, then search songs and press the heart to save them.</p>'}`;

$('#libCreate').onclick = openModal;
}

function page(p) {
if (p === 'home') home();
else if (p === 'search') searchIntro();
else if (p === 'library') libraryPage();
else if (p === 'liked') {
currentPage = 'liked';
results('Liked Songs',liked);
} else if (p.startsWith('playlist:')) {
currentPage = p;
let pl = playlists.find(x=>x.id === p.split(':')[1]);
if (pl) results(pl.name,pl.tracks);
}
}

function toggleLike(t) {
if (!t) return;

if (isLiked(t)) {
liked = liked.filter(x=>x.id !== t.id);
toast('Removed from liked songs');
} else {
liked.unshift(t);
toast('Added to liked songs');
}

persist();

const current = currentList[currentIndex];
$('#playerLike').textContent = current && isLiked(current) ? '♥' : '♡';
$('#playerLike').classList.toggle('saved',!!current && isLiked(current));

if (currentPage === 'liked') results('Liked Songs',liked);
}

function openModal() {
$('#modalBack').style.display = 'grid';
$('#playlistName').value = '';
$('#playlistName').focus();
}

function closeModal() {
$('#modalBack').style.display = 'none';
}

function createPlaylist() {
const n = $('#playlistName').value.trim();
if (!n) return;

const p = {id:Date.now().toString(36),name:n,tracks:[]};
playlists.unshift(p);
persist();
closeModal();
page('playlist:' + p.id);
toast('Playlist created');
}

async function play(list,i) {
if (!list.length) return;

currentList = list;
currentIndex = (i + list.length) % list.length;

const t = list[currentIndex];

$('#playerTitle').textContent = t.title;
$('#playerArtist').textContent = artist(t);
$('#playerArt').src = art(t);
$('#playerLike').textContent = isLiked(t) ? '♥' : '♡';
$('#playerLike').classList.toggle('saved',isLiked(t));

if (t.spotifyUri) {
audio.pause();
audio.removeAttribute('src');
try {
await playSpotifyTrack(t);
} catch(e) {
toast(e.message);
}
return;
}

if (!t.preview_url) {
audio.pause();
toast('No playable preview for this song');
return;
}

if (spotifyPlayer) {
try { await spotifyPlayer.pause(); } catch(e) {}
}

audio.src = t.preview_url;
audio.volume = +$('#volume').value;

try {
await audio.play();
} catch(e) {
toast('Tap play again to start the preview');
}
}

function next(d=1) {
if (!currentList.length) return;
play(currentList,shuffle ? Math.floor(Math.random()*currentList.length) : (currentIndex+d+currentList.length)%currentList.length);
}

/* Search */
$('#searchInput').addEventListener('input',e=>{
clearTimeout(timer);
const q = e.target.value;
timer = setTimeout(()=>q.trim()?search(q):searchIntro(),450);
});

$('#searchInput').addEventListener('keydown',e=>{
if (e.key === 'Enter') search(e.target.value);
if (e.key === 'Escape') {
e.target.value = '';
searchIntro();
}
});

/* Navigation and track actions */
document.addEventListener('click',e=>{
const p = e.target.closest('[data-page]');
if (p) {
page(p.dataset.page);
return;
}

const b = e.target.closest('[data-play]');
if (b) {
play(currentList,+b.dataset.play);
return;
}

const l = e.target.closest('[data-like]');
if (l) {
const t = currentList.find(t=>String(t.id) === l.dataset.like);
toggleLike(t);
}
});

document.querySelectorAll('.nav button[data-page]').forEach(btn=>{
btn.addEventListener('click',()=>{
document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
btn.classList.add('active');
});
});

$('#newPlaylist').onclick = openModal;
$('#createChip').onclick = openModal;
$('#cancelModal').onclick = closeModal;
$('#savePlaylist').onclick = createPlaylist;

$('#modalBack').onclick = e=>{
if (e.target.id === 'modalBack') closeModal();
};

$('#playlistName').onkeydown = e=>{
if (e.key === 'Enter') createPlaylist();
if (e.key === 'Escape') closeModal();
};

/* Play/pause works with Spotify tracks and iTunes previews */
$('#playBtn').onclick = async ()=>{
const t = currentList[currentIndex];

if (t?.spotifyUri) {
try {
if (!spotifyPlayer) {
initSpotifyPlayer();
toast('Wait for the Spotify player to connect.');
return;
}
await spotifyPlayer.activateElement();
await spotifyPlayer.togglePlay();
} catch(e) {
toast(e.message);
}
return;
}

if (!audio.src) {
if (currentList.length) play(currentList,Math.max(0,currentIndex));
return;
}

if (audio.paused) {
try { await audio.play(); }
catch(e) { toast('This preview is not available'); }
} else {
audio.pause();
}
};

$('#nextBtn').onclick = ()=>next(1);

$('#prevBtn').onclick = ()=>{
if (currentList[currentIndex]?.spotifyUri && spotifyPlayer) {
spotifyPlayer.previousTrack().catch(()=>next(-1));
} else if (audio.currentTime > 3) {
audio.currentTime = 0;
} else {
next(-1);
}
};

$('#shuffleBtn').onclick = ()=>{
shuffle = !shuffle;
$('#shuffleBtn').style.color = shuffle ? 'var(--green)' : '';
};

$('#repeatBtn').onclick = ()=>{
repeat = !repeat;
$('#repeatBtn').style.color = repeat ? 'var(--green)' : '';
};

$('#playerLike').onclick = ()=>toggleLike(currentList[currentIndex]);

$('#volume').oninput = e=>{
audio.volume = +e.target.value;
if (spotifyPlayer) spotifyPlayer.setVolume(+e.target.value);
};

audio.ontimeupdate = ()=>{
if (audio.duration) {
$('#seek').value = audio.currentTime / audio.duration * 1000;
$('#elapsed').textContent = fmt(audio.currentTime);
$('#duration').textContent = fmt(audio.duration);
}
};

$('#seek').oninput = e=>{
const t = currentList[currentIndex];
if (t?.spotifyUri && spotifyPlayer) {
spotifyPlayer.seek(+e.target.value / 1000 * (t.duration || 0) * 1000).catch(()=>{});
} else if (audio.duration) {
audio.currentTime = +e.target.value / 1000 * audio.duration;
}
};

audio.onended = ()=>{
if (repeat) {
audio.currentTime = 0;
audio.play();
} else {
next(1);
}
};

audio.onplay = ()=>$('#playBtn').textContent = 'Ⅱ';
audio.onpause = ()=>$('#playBtn').textContent = '▶';

$('#backBtn').onclick = ()=>home();
$('#forwardBtn').onclick = ()=>searchIntro();

$('#profileBtn').onclick = ()=>{
if (spotifyAccessToken || spotifyRefreshToken) {
initSpotifyPlayer();
toast('Spotify is connected.');
} else {
spotifyLogin().catch(e=>toast(e.message));
}
};

renderLibrary();

/* Handle Spotify redirect before rendering the homepage */
handleSpotifyCallback().finally(()=>home());

})();
</script>

<script src="https://sdk.scdn.co/spotify-player.js" async></script>
</body>
</html>
