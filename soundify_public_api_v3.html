<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Soundify — Music for everyone</title>
<style>
:root{--panel:#121212;--muted:#aaa;--green:#1ed760}*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:14px Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit}.app{min-height:100vh;display:grid;grid-template-columns:225px 1fr;grid-template-rows:minmax(500px,1fr) 88px;gap:8px;padding:8px}.sidebar{display:flex;flex-direction:column;gap:8px}.nav,.library,.main{background:var(--panel);border-radius:8px}.nav{padding:18px 12px}.brand{font-size:22px;font-weight:bold;margin:5px 8px 22px}.brand span{background:var(--green);color:#000;border-radius:50%;padding:5px}.nav button,.lib-head button{display:block;background:none;color:var(--muted);padding:12px 8px;text-align:left;width:100%;font-weight:bold}.nav button:hover,.nav button.active{color:white}.library{padding:14px 8px;overflow:auto}.lib-head{display:flex;align-items:center}.lib-head button:last-child{width:auto;font-size:20px}.lib-tools{display:flex;gap:8px;margin:8px 0}.chip{background:#282828;border-radius:18px;padding:8px 12px}.lib-item{display:flex;align-items:center;gap:10px;padding:8px;cursor:pointer}.lib-item img{width:44px;height:44px;object-fit:cover}.lib-item small{display:block;color:var(--muted);margin-top:5px}.main{overflow:auto;background:linear-gradient(#203a31,#121212 330px)}.topbar{position:sticky;top:0;background:#101412ee;padding:16px;display:flex;gap:10px;align-items:center;z-index:2}.searchbox{background:white;color:#111;border-radius:24px;padding:12px 16px;display:flex;gap:8px;flex:1;max-width:550px}.searchbox input{border:0;outline:0;flex:1;min-width:0}.profile{margin-left:auto;background:#050505;border-radius:20px;padding:10px}.content{padding:8px 24px 32px}.welcome{font-size:30px}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick{display:flex;align-items:center;gap:10px;background:#ffffff19;border-radius:5px;overflow:hidden;font-weight:bold;cursor:pointer}.quick img{width:58px;height:58px;object-fit:cover}.section-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}.section-head h2{margin:0;font-size:23px}.section-head button{background:none;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{background:#181818;padding:12px;border-radius:7px;min-width:0;cursor:pointer}.card:hover{background:#292929}.cover{position:relative;aspect-ratio:1;margin-bottom:12px}.cover img{width:100%;height:100%;object-fit:cover;border-radius:5px}.cover button{position:absolute;right:8px;bottom:8px;border-radius:50%;background:var(--green);color:#000;width:42px;height:42px;opacity:0}.card:hover .cover button{opacity:1}.card h3{font-size:14px;margin:0 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card p{color:var(--muted);font-size:12px;line-height:1.4;margin:0}.status,.empty{color:var(--muted);line-height:1.6}.track-table{width:100%;border-collapse:collapse;margin-top:15px}.track-table th{text-align:left;color:var(--muted);font-weight:normal;border-bottom:1px solid #333;padding:10px 7px}.track-table td{padding:9px 7px;color:var(--muted)}.track-table tr:hover{background:#ffffff12}.track-title{display:flex;align-items:center;gap:10px;min-width:190px}.track-title img{width:42px;height:42px;object-fit:cover}.track-title strong{color:white;display:block;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track-title small{display:block;margin-top:5px}.player{grid-column:1/3;display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;gap:18px;padding:0 14px;background:#000;border-top:1px solid #292929}.now-playing{display:flex;align-items:center;gap:10px;min-width:0}.now-playing img{width:52px;height:52px;object-fit:cover}.now-playing strong,.now-playing small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.now-playing small{color:var(--muted);margin-top:5px}.player-controls{display:flex;flex-direction:column;align-items:center;gap:7px}.control-row{display:flex;align-items:center;gap:18px}.control-row button{background:none;color:#ddd;font-size:18px}.control-row .play-main{background:white;color:black;border-radius:50%;width:34px;height:34px}.progress{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;width:100%;max-width:500px}.progress input{flex:1;min-width:30px;accent-color:var(--green)}.volume{display:flex;justify-content:flex-end;gap:8px;align-items:center}.volume input{width:90px;accent-color:var(--green)}.like{background:none;color:var(--muted);font-size:18px}.saved{color:var(--green)}.toast{display:none;position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#333;padding:12px 18px;border-radius:8px;z-index:5}.modal-back{display:none;position:fixed;inset:0;background:#000b;place-items:center;z-index:8}.modal{background:#282828;padding:24px;border-radius:10px;width:min(400px,90vw)}.modal input{width:100%;padding:12px;margin:10px 0 18px}.primary{background:var(--green);color:#000;padding:11px 18px;border-radius:22px;font-weight:bold}.secondary{background:none;padding:11px}.actions{display:flex;justify-content:flex-end}.mobile-nav{display:none}
@media(max-width:900px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.quick-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:flex;flex-direction:column;padding:0}.sidebar{display:none}.main{border-radius:0;min-height:calc(100vh - 78px)}.content{padding:10px 14px 110px}.topbar{padding:10px}.welcome{font-size:25px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.player{position:sticky;bottom:0;grid-column:auto;grid-template-columns:1fr auto;gap:6px;padding:7px}.now-playing img{width:42px;height:42px}.control-row{gap:9px}.control-row button:not(.play-main){display:none}.progress{width:145px}.volume{display:none}}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="nav"><div class="brand"><span>≋</span> soundify</div><button class="active" data-page="home">⌂　Home</button><button data-page="search">⌕　Search</button></div><div class="library"><div class="lib-head"><button data-page="library">▤　Your Library</button><button id="newPlaylist">＋</button></div><div class="lib-tools"><button class="chip" id="createChip">＋ Create</button><button class="chip" data-page="liked">Liked songs</button></div><div id="libraryItems"></div></div></aside>
<main class="main"><div class="topbar"><button id="backBtn" class="chip">‹</button><button id="forwardBtn" class="chip">›</button><label class="searchbox">⌕ <input id="searchInput" placeholder="What do you want to play?" autocomplete="off"></label><button class="profile" id="profileBtn">No login needed</button></div><div class="content" id="content"><p class="status">Loading music…</p></div></main>
<div class="player"><div class="now-playing"><img id="playerArt" src="https://placehold.co/100x100/222/fff?text=♪" alt=""><div style="min-width:0"><strong id="playerTitle">Choose a track</strong><small id="playerArtist">Search for a song</small></div><button class="like" id="playerLike">♡</button></div><div class="player-controls"><div class="control-row"><button id="shuffleBtn">⤨</button><button id="prevBtn">◀|</button><button id="playBtn" class="play-main">▶</button><button id="nextBtn">|▶</button><button id="repeatBtn">↻</button></div><div class="progress"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="duration">0:00</span></div></div><div class="volume">◖)) <input id="volume" type="range" min="0" max="1" step=".01" value=".8"></div></div></div>
<audio id="audio" preload="none"></audio><div id="toast" class="toast"></div><div class="modal-back" id="modalBack"><div class="modal"><h2>Create a playlist</h2><input id="playlistName" placeholder="My awesome playlist" maxlength="60"><div class="actions"><button class="secondary" id="cancelModal">Cancel</button><button class="primary" id="savePlaylist">Create</button></div></div></div>
<script>
(()=>{const $=s=>document.querySelector(s),audio=$('#audio'),fallback='https://placehold.co/400x400/282828/eee?text=♪';let tracks=[],currentList=[],currentIndex=-1,currentPage='home',timer,shuffle=false,repeat=false;let playlists=JSON.parse(localStorage.getItem('soundify_playlists')||'[]'),liked=JSON.parse(localStorage.getItem('soundify_liked')||'[]');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),art=t=>t?.artworkUrl100?.replace('100x100bb','500x500bb')||fallback,artist=t=>t?.artistName||t?.artist||'Unknown artist',fmt=n=>{n=Math.max(0,Math.floor(+n||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
function toast(s){let e=$('#toast');e.textContent=s;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2300)}
function persist(){localStorage.setItem('soundify_playlists',JSON.stringify(playlists));localStorage.setItem('soundify_liked',JSON.stringify(liked));renderLibrary()}
function clean(s=''){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function sim(a,b){a=clean(a);b=clean(b);if(!a||!b)return 0;if(a===b)return 1;let row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=b.length;j++){let old=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old}}return Math.max(0,1-row[b.length]/Math.max(a.length,b.length))}
function score(t,q){return Math.max(sim(q,t.trackName),sim(q,t.artistName)*.92,sim(q,(t.trackName||'')+' '+(t.artistName||''))*.98)}
function api(q,limit=25){return new Promise((resolve,reject)=>{const cb='soundifyCB_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const params=new URLSearchParams({term:q,entity:'song',limit:String(limit),country:'US',callback:cb});let done=false;const cleanup=()=>{if(done)return;done=true;try{delete window[cb]}catch(e){window[cb]=undefined}script.remove()};const timeout=setTimeout(()=>{cleanup();reject(Error('Music search timed out'))},12000);window[cb]=(d)=>{clearTimeout(timeout);cleanup();resolve((d.results||[]).filter(t=>t.kind==='song').map(t=>({...t,id:String(t.trackId),title:t.trackName,preview_url:t.previewUrl||'',duration:(t.trackTimeMillis||0)/1000}))) };script.onerror=()=>{clearTimeout(timeout);cleanup();reject(Error('Search failed'))};script.src='https://itunes.apple.com/search?'+params.toString();document.head.appendChild(script)})}
function isLiked(t){return liked.some(x=>String(x.id)===String(t.id))}
function card(t,i){return `<article class="card" data-play="${i}"><div class="cover"><img loading="lazy" src="${esc(art(t))}"><button data-play="${i}">▶</button></div><h3>${esc(t.title)}</h3><p>${esc(artist(t))}</p></article>`}
async function home(){currentPage='home';$('#content').innerHTML=`<h1 class="welcome">Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}</h1><div class="quick-grid"><div class="quick" data-page="liked"><img src="${esc(liked[0]?art(liked[0]):fallback)}"><span>Liked Songs</span></div><div class="quick" data-page="search"><img src="${fallback}"><span>Discover new music</span></div><div class="quick" data-page="library"><img src="${fallback}"><span>Your playlists</span></div></div><div class="section-head"><h2>Popular tracks</h2><button id="refresh">REFRESH</button></div><div id="homeCards" class="cards"><p class="status">Loading songs…</p></div><p class="status">Free song previews are provided by the iTunes Search API. Some tracks may not have previews.</p>`;try{tracks=await api('top hits',25);currentList=tracks;$('#homeCards').innerHTML=tracks.slice(0,15).map(card).join('')||'<p class="empty">No tracks found.</p>'}catch(e){$('#homeCards').innerHTML='<p class="empty">Could not load songs. Check your internet connection and try again.</p>'}$('#refresh').onclick=home}
function searchIntro(){currentPage='search';$('#content').innerHTML=`<h1 class="welcome">Search</h1><p class="status">Search a song or artist. If you make a typo, Soundify tries to put the closest matches first.</p><div class="quick-grid">${[['Pop','#5a3476'],['Chill','#315b55'],['Hip-Hop','#8b5b25'],['Rock','#365b83'],['Dance','#8c3150'],['Jazz','#376e4b']].map(([n,c])=>`<div class="quick mood" data-q="${n}" style="background:${c};padding:18px">${n}</div>`).join('')}</div>`;document.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{ $('#searchInput').value=b.dataset.q;search(b.dataset.q)})}
async function search(q){q=q.trim();currentPage='search';if(!q)return searchIntro();$('#content').innerHTML=`<h1 class="welcome">Search results</h1><p class="status">Searching for “${esc(q)}”…</p>`;try{let arr=await api(q,25);if(!arr.length||Math.max(0,...arr.map(t=>score(t,q)))<.4){let words=clean(q).split(' ').filter(w=>w.length>1).slice(0,4),groups=await Promise.all(words.map(w=>api(w,15).catch(()=>[]))),seen=new Set(arr.map(t=>t.id));for(let g of groups)for(let t of g)if(!seen.has(t.id)){seen.add(t.id);arr.push(t)}}arr.sort((a,b)=>score(b,q)-score(a,q));tracks=arr;results(`Results for “${q}”`,arr);if(arr.length&&score(arr[0],q)<.65)toast('Closest matches are shown first')}catch(e){$('#content').innerHTML='<h1 class="welcome">Search</h1><p class="empty">Could not reach the music service. Check your connection and retry.</p>'}}
function results(title,arr){currentList=arr;$('#content').innerHTML=`<h1 class="welcome">${esc(title)}</h1><div class="section-head"><h2>Songs</h2><span class="status">${arr.length} results</span></div><table class="track-table"><thead><tr><th>#</th><th>Title</th><th>Album</th><th>Save</th><th>Time</th></tr></thead><tbody>${arr.map((t,i)=>`<tr><td><button data-play="${i}" style="background:none">▶</button></td><td><div class="track-title"><img src="${esc(art(t))}"><div><strong>${esc(t.title)}</strong><small>${esc(artist(t))}</small></div></div></td><td>${esc(t.collectionName||'')}</td><td><button class="like ${isLiked(t)?'saved':''}" data-like="${esc(t.id)}">${isLiked(t)?'♥':'♡'}</button></td><td>${fmt(t.duration)}</td></tr>`).join('')}</tbody></table>${arr.length?'':'<p class="empty">No songs found. Try a different search.</p>'}`}
function renderLibrary(){let el=$('#libraryItems');el.innerHTML=playlists.map(p=>`<div class="lib-item" data-page="playlist:${p.id}"><img src="${esc(p.tracks[0]?art(p.tracks[0]):fallback)}"><div><strong>${esc(p.name)}</strong><small>Playlist · ${p.tracks.length} songs</small></div></div>`).join('')+`<div class="lib-item" data-page="liked"><img src="${esc(liked[0]?art(liked[0]):fallback)}"><div><strong>Liked Songs</strong><small>Playlist · ${liked.length} songs</small></div></div>`}
function libraryPage(){currentPage='library';renderLibrary();$('#content').innerHTML=`<h1 class="welcome">Your Library</h1><div class="section-head"><h2>Playlists</h2><button id="libCreate">＋ CREATE PLAYLIST</button></div><div class="cards">${playlists.map(p=>`<article class="card" data-page="playlist:${p.id}"><div class="cover"><img src="${esc(p.tracks[0]?art(p.tracks[0]):fallback)}"></div><h3>${esc(p.name)}</h3><p>${p.tracks.length} songs</p></article>`).join('')}</div>${playlists.length?'':'<p class="empty">Create a playlist, then search songs and press the heart to save them.</p>'}`;$('#libCreate').onclick=openModal}
function page(p){if(p==='home')home();else if(p==='search')searchIntro();else if(p==='library')libraryPage();else if(p==='liked'){currentPage='liked';results('Liked Songs',liked)}else if(p.startsWith('playlist:')){currentPage=p;let pl=playlists.find(x=>x.id===p.split(':')[1]);if(pl)results(pl.name,pl.tracks)}}
function toggleLike(t){if(!t)return;if(isLiked(t)){liked=liked.filter(x=>x.id!==t.id);toast('Removed from liked songs')}else{liked.unshift(t);toast('Added to liked songs')}persist();$('#playerLike').textContent=isLiked(t)?'♥':'♡';$('#playerLike').classList.toggle('saved',isLiked(t));if(currentPage==='liked')results('Liked Songs',liked)}
function openModal(){$('#modalBack').style.display='grid';$('#playlistName').value='';$('#playlistName').focus()}function closeModal(){$('#modalBack').style.display='none'}function createPlaylist(){let n=$('#playlistName').value.trim();if(!n)return;let p={id:Date.now().toString(36),name:n,tracks:[]};playlists.unshift(p);persist();closeModal();page('playlist:'+p.id);toast('Playlist created')}
async function play(list,i){if(!list.length)return;currentList=list;currentIndex=(i+list.length)%list.length;let t=list[currentIndex];$('#playerTitle').textContent=t.title;$('#playerArtist').textContent=artist(t);$('#playerArt').src=art(t);$('#playerLike').textContent=isLiked(t)?'♥':'♡';$('#playerLike').classList.toggle('saved',isLiked(t));if(!t.preview_url){audio.pause();toast('No playable preview for this song');return}audio.src=t.preview_url;audio.volume=+$('#volume').value;try{await audio.play()}catch(e){toast('Tap play again to start the preview')}}
function next(d=1){if(!currentList.length)return;play(currentList,shuffle?Math.floor(Math.random()*currentList.length):(currentIndex+d+currentList.length)%currentList.length)}
$('#searchInput').addEventListener('input',e=>{clearTimeout(timer);let q=e.target.value;timer=setTimeout(()=>q.trim()?search(q):searchIntro(),450)});$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')search(e.target.value);if(e.key==='Escape'){e.target.value='';searchIntro()}});
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){page(p.dataset.page);return}let b=e.target.closest('[data-play]');if(b){play(currentList,+b.dataset.play);return}let l=e.target.closest('[data-like]');if(l)toggleLike(currentList.find(t=>t.id===l.dataset.like))});
$('#newPlaylist').onclick=openModal;$('#createChip').onclick=openModal;$('#cancelModal').onclick=closeModal;$('#savePlaylist').onclick=createPlaylist;$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()};$('#playlistName').onkeydown=e=>{if(e.key==='Enter')createPlaylist();if(e.key==='Escape')closeModal()};
$('#playBtn').onclick=async()=>{if(!audio.src){if(currentList.length)play(currentList,Math.max(0,currentIndex));return}if(audio.paused){try{await audio.play()}catch(e){toast('This preview is not available')}}else audio.pause()};
$('#nextBtn').onclick=()=>next(1);$('#prevBtn').onclick=()=>{if(audio.currentTime>3)audio.currentTime=0;else next(-1)};$('#shuffleBtn').onclick=()=>{shuffle=!shuffle;$('#shuffleBtn').style.color=shuffle?'var(--green)':''};$('#repeatBtn').onclick=()=>{repeat=!repeat;$('#repeatBtn').style.color=repeat?'var(--green)':''};$('#playerLike').onclick=()=>toggleLike(currentList[currentIndex]);$('#volume').oninput=e=>audio.volume=+e.target.value;audio.ontimeupdate=()=>{if(audio.duration){$('#seek').value=audio.currentTime/audio.duration*1000;$('#elapsed').textContent=fmt(audio.currentTime);$('#duration').textContent=fmt(audio.duration)}};$('#seek').oninput=e=>{if(audio.duration)audio.currentTime=+e.target.value/1000*audio.duration};audio.onended=()=>repeat?(audio.currentTime=0,audio.play()):next(1);audio.onplay=()=>$('#playBtn').textContent='Ⅱ';audio.onpause=()=>$('#playBtn').textContent='▶';$('#backBtn').onclick=()=>home();$('#forwardBtn').onclick=()=>searchIntro();$('#profileBtn').onclick=()=>toast('No account or API key required.');renderLibrary();home()})();
</script></body></html>
